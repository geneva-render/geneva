name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created at the chosen ref if it does not exist). Leave empty to build the binaries and attach them to the run without tagging or releasing anything."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      # Set these repository secrets to get signed and notarized macOS
      # binaries; without them the macOS build is shipped unsigned.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older runners keep the glibc requirement low (2.35).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows is cross-built with MinGW-w64 on Linux and smoke-tested
          # on a Windows runner below. The newer runner has the MinGW
          # headers FFmpeg's Media Foundation encoders need.
          - os: ubuntu-24.04
            target: x86_64-pc-windows-gnu
            media_host: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # ffmpeg-sys-next bundles the static media archives into its rlib
          # when it is built, so a target cache is only valid for the media
          # libraries it was built against.
          key: media-${{ matrix.target }}-${{ hashFiles('scripts/build-media-libs.sh') }}
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake meson ninja-build nasm pkg-config clang zlib1g-dev ${{ matrix.media_host && 'mingw-w64' || '' }}
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake meson ninja nasm pkg-config
      - name: Cache media libraries
        id: media-libs
        uses: actions/cache@v4
        with:
          path: target/media-libs
          key: media-libs-${{ matrix.target }}-${{ hashFiles('scripts/build-media-libs.sh') }}
      - name: Build media libraries
        if: steps.media-libs.outputs.cache-hit != 'true'
        env:
          MEDIA_HOST: ${{ matrix.media_host }}
        run: scripts/build-media-libs.sh
      - name: Rebuild the media bindings against fresh libraries
        if: steps.media-libs.outputs.cache-hit != 'true'
        run: cargo clean -p ffmpeg-sys-next --release --target ${{ matrix.target }}
      # Built for the named target, so the binary is under target/<target>.
      - name: Build
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          exe=geneva; case "${{ matrix.target }}" in *windows*) exe=geneva.exe ;; esac
          mkdir -p dist && cp "target/${{ matrix.target }}/release/$exe" dist/
      - name: Sign (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp \
            --force dist/geneva
          codesign --verify --strict --verbose=2 dist/geneva
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        run: |
          ditto -c -k dist/geneva "$RUNNER_TEMP/geneva.zip"
          xcrun notarytool submit "$RUNNER_TEMP/geneva.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      # A zip for Windows, with the PowerShell installer in place of the
      # shell scripts; a tarball everywhere else.
      - name: Package
        run: |
          name=geneva-${RELEASE_TAG}-${{ matrix.target }}
          mkdir -p "$name/licenses"
          cp dist/* README.md LICENSE THIRD-PARTY-NOTICES.md "$name/"
          cp licenses/* target/media-libs/share/licenses/* "$name/licenses/"
          case "${{ matrix.target }}" in
            *windows*)
              cp scripts/install.ps1 "$name/"
              zip -qr "$name.zip" "$name" ;;
            *)
              cp scripts/install.sh scripts/check.sh "$name/"
              tar czf "$name.tar.gz" "$name" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: geneva-${{ matrix.target }}
          path: |
            geneva-*.tar.gz
            geneva-*.zip
  # The Windows build, on Windows, before anything is published: signed
  # when the Certum secrets are set (the binary and install.ps1, so a
  # RemoteSigned policy runs the installer from the zip), then installed
  # from the zip the way a user would and run once through every everyday
  # command. The signed zip replaces the unsigned one.
  windows:
    name: Sign and smoke test on Windows
    needs: build
    runs-on: windows-latest
    env:
      CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: geneva-x86_64-pc-windows-gnu
      - name: Unpack
        shell: pwsh
        run: |
          # Windows' own tar, which reads and writes zips; Git's GNU tar
          # may come first on the PATH and does neither.
          $tar = "$env:SystemRoot\System32\tar.exe"
          "TAR=$tar" >> $env:GITHUB_ENV
          $zip = Get-Item geneva-*.zip
          & $tar -xf $zip.FullName
          "ZIP=$($zip.Name)" >> $env:GITHUB_ENV
          "DIR=$($zip.BaseName)" >> $env:GITHUB_ENV
      # SimplySign Desktop, logged in with the account's TOTP seed. Pinned
      # to the commit that was read, since it handles that seed.
      - name: Log in to SimplySign
        id: certum
        if: env.CERTUM_USERNAME != ''
        uses: jay0lee/certum-cloud-code-sign@c426e3f9dcac447a666692df3281522dbc03140b
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          cert_sha1: ${{ secrets.CERTUM_CERT_SHA1 }}
      - name: Sign
        if: env.CERTUM_USERNAME != ''
        shell: pwsh
        run: |
          $files = "$env:DIR\geneva.exe", "$env:DIR\install.ps1"
          & "${{ steps.certum.outputs.signtool-path }}" sign /sha1 ${{ steps.certum.outputs.cert-thumbprint }} `
            /fd SHA256 /tr http://time.certum.pl /td SHA256 /v @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ steps.certum.outputs.signtool-path }}" verify /pa /v @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $env:ZIP
          & $env:TAR -a -cf $env:ZIP $env:DIR
      - name: Replace the unsigned zip
        if: env.CERTUM_USERNAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: geneva-x86_64-pc-windows-gnu
          path: ${{ env.ZIP }}
          overwrite: true
      # Installed the way a user would, with the zip's own installer under
      # the Windows PowerShell every machine has, then run from there.
      - name: Install from the zip
        shell: powershell
        run: |
          Expand-Archive $env:ZIP -DestinationPath unpacked
          $env:GENEVA_PREFIX = "$env:RUNNER_TEMP\geneva"
          & (Get-Item unpacked\geneva-*\install.ps1).FullName
          Add-Content $env:GITHUB_PATH $env:GENEVA_PREFIX
      - name: Smoke test
        shell: bash
        run: scripts/smoke.sh
  # Only when there is something to release: a tag was pushed, or a tag was
  # named on dispatch. A dispatch with no tag stops after the build, and
  # its binaries are the run's artifacts, which is how a machine that
  # cannot build them locally gets one to test.
  publish:
    needs: [build, windows]
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The release notes are the tag's section of CHANGELOG.md.
      - name: Release notes
        run: |
          version=${RELEASE_TAG#v}
          awk -v v="$version" '/^## /{on = ($2 == v)} on && !/^## /' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          [ -s notes.md ] || echo "No changelog entry for $RELEASE_TAG." > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            geneva-*.tar.gz
            geneva-*.zip
