name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly cross-platform run; pushes and pull requests test on Linux only.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libav (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev clang pkg-config
      - name: Install libav (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Clippy without media support (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Test without media support (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-default-features
      - name: Schema is up to date
        run: cargo run -q -p geneva-cli -- schema | diff - schema/geneva-timeline-0.1.schema.json
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: target/golden-failures
          if-no-files-found: ignore
