name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly cross-platform run; pushes and pull requests test on Linux only.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # ffmpeg-sys-next bundles the static media archives into its rlib
          # when it is built, so a target cache is only valid for the media
          # libraries it was built against.
          key: media-${{ hashFiles('scripts/build-media-libs.sh') }}
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake meson ninja-build nasm pkg-config clang zlib1g-dev libx264-dev
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake meson ninja nasm pkg-config
      - name: Cache media libraries
        if: runner.os != 'Windows'
        id: media-libs
        uses: actions/cache@v4
        with:
          path: target/media-libs
          key: media-libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-media-libs.sh') }}
      - name: Build media libraries
        if: runner.os != 'Windows' && steps.media-libs.outputs.cache-hit != 'true'
        run: scripts/build-media-libs.sh
      - name: Rebuild the media bindings against fresh libraries
        if: runner.os != 'Windows' && steps.media-libs.outputs.cache-hit != 'true'
        run: cargo clean -p ffmpeg-sys-next
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Clippy without media support (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Test without media support (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-default-features
      - name: Schema is up to date
        run: cargo run -q -p geneva-cli -- schema | diff - schema/geneva-timeline-0.2.schema.json
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: target/golden-failures
          if-no-files-found: ignore
