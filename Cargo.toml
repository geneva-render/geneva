[workspace]
resolver = "2"
members = [
    "crates/geneva-anim",
    "crates/geneva-audio",
    "crates/geneva-color",
    "crates/geneva-timeline",
    "crates/geneva-html",
    "crates/geneva-render",
    "crates/geneva-golden",
    "crates/geneva-gpu",
    "crates/geneva-media",
    "crates/geneva-media-link",
    "crates/geneva-cli",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/geneva-render/geneva"
homepage = "https://github.com/geneva-render/geneva"
authors = ["Francesco Benetti <francesco@benetti.dev>"]

[workspace.dependencies]
geneva-anim = { path = "crates/geneva-anim", version = "1.1.0" }
geneva-audio = { path = "crates/geneva-audio", version = "1.1.0" }
geneva-color = { path = "crates/geneva-color", version = "1.1.0" }
geneva-timeline = { path = "crates/geneva-timeline", version = "1.1.0" }
geneva-html = { path = "crates/geneva-html", version = "1.1.0" }
geneva-render = { path = "crates/geneva-render", version = "1.1.0" }
geneva-golden = { path = "crates/geneva-golden", version = "1.1.0" }
geneva-gpu = { path = "crates/geneva-gpu", version = "1.1.0" }
geneva-media = { path = "crates/geneva-media", version = "1.1.0", default-features = false }
geneva-media-link = { path = "crates/geneva-media-link", version = "1.1.0" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
schemars = { version = "1.0", features = ["preserve_order"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_path_to_error = "0.1"
thiserror = "2.0"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
swash = "0.2"
kurbo = { version = "0.13", default-features = false, features = ["std"] }
taffy = { version = "0.9", default-features = false, features = ["std", "flexbox", "block_layout", "content_size", "calc", "taffy_tree"] }
pollster = "0.4"
bytemuck = { version = "1.20", features = ["derive"] }
half = "2.4"
wgpu = { version = "30", default-features = false, features = ["vulkan", "metal", "dx12", "wgsl"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
return_self_not_must_use = "allow"
float_cmp = "allow"
many_single_char_names = "allow"
needless_raw_string_hashes = "allow"
single_match_else = "allow"
result_large_err = "allow"
cast_possible_wrap = "allow"
explicit_iter_loop = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
