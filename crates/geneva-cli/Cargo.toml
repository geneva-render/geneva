[package]
name = "geneva-cli"
description = "The geneva command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "geneva"
path = "src/main.rs"

[features]
default = ["media"]
# Media probing, video decoding and rendering to files, with the media
# libraries built by scripts/build-media-libs.sh linked statically.
media = ["geneva-media/media"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
geneva-color = { workspace = true }
geneva-media = { workspace = true }
geneva-render = { workspace = true }
geneva-timeline = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
geneva-media-link = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[lints]
workspace = true
