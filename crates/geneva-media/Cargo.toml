[package]
name = "geneva-media"
description = "Media probing, decoding and encoding for the Geneva engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["media"]
# Media I/O through the media libraries built by scripts/build-media-libs.sh
# and linked statically. Without it the crate only offers the
# hardware-independent conversions and types.
media = ["dep:ffmpeg-next", "ffmpeg-next/static"]

[dependencies]
geneva-anim = { workspace = true }
geneva-color = { workspace = true }
geneva-render = { workspace = true }
geneva-timeline = { workspace = true }
ffmpeg-next = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
geneva-media-link = { workspace = true }

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
