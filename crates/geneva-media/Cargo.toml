[package]
name = "geneva-media"
description = "Media probing, decoding and encoding for the Geneva engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["media"]
# Media I/O through the media libraries built by scripts/build-media-libs.sh
# and linked statically. Without it the crate only offers the
# hardware-independent conversions and types.
media = ["dep:ffmpeg-next", "ffmpeg-next/static"]

[dependencies]
geneva-anim = { workspace = true }
geneva-color = { workspace = true }
geneva-render = { workspace = true }
geneva-timeline = { workspace = true }
ffmpeg-next = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
geneva-media-link = { workspace = true }

[dev-dependencies]
tempfile = "3.10"

# This crate owns the FFI boundary and needs `unsafe` in one audited place
# (codecs/ffi.rs), so it carries its own copy of the workspace lints with
# `unsafe_code` at deny instead of forbid.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
return_self_not_must_use = "allow"
float_cmp = "allow"
many_single_char_names = "allow"
needless_raw_string_hashes = "allow"
single_match_else = "allow"
result_large_err = "allow"
cast_possible_wrap = "allow"
explicit_iter_loop = "allow"
