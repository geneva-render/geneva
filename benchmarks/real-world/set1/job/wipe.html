<style>
  /* A one second diagonal wipe: a bar sweeps the frame, a thin accent
     edge leads it. clip-path polygon() is drawn by both renderers. */
  html, body { margin: 0 }
  .sweep { position: absolute; inset: 0; background: #050b14;
    clip-path: polygon(-40% 0%, -10% 0%, -30% 100%, -60% 100%);
    animation: sweep 1s cubic-bezier(.65,.02,.31,1) forwards }
  .edge { position: absolute; inset: 0; background: #e8b53a;
    clip-path: polygon(-12% 0%, -10% 0%, -30% 100%, -32% 100%);
    animation: sweep 1s cubic-bezier(.65,.02,.31,1) forwards }
  @keyframes sweep { to { transform: translateX(190%) } }
</style>
<div class="sweep"></div><div class="edge"></div>
