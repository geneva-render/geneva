: " her.", "start": 45.643, "end": 46.0}]}, {"start": 47.0, "end": 48.5, "text": " She is your passion!", "words": [{"word": " She", "start": 47.0, "end": 47.286}, {"word": " is", "start": 47.286, "end": 47.5}, {"word": " your", "start": 47.5, "end": 47.857}, {"word": " passion!", "start": 47.857, "end": 48.5}]}, {"start": 50.0, "end": 51.0, "text": " Be tender to her.", "words": [{"word": " Be", "start": 50.0, "end": 50.167}, {"word": " tender", "start": 50.167, "end": 50.556}, {"word": " to", "start": 50.556, "end": 50.722}, {"word": " her.", "start": 50.722, "end": 51.0}]}, {"start": 51.5, "end": 54.5, "text": " Be honest! Eh- be tender.", "words": [{"word": " Be", "start": 51.5, "end": 51.846}, {"word": " honest!", "start": 51.846, "end": 52.769}, {"word": " Eh-", "start": 52.769, "end": 53.231}, {"word": " be", "start": 53.231, "end": 53.577}, {"word": " tender.", "start": 53.577, "end": 54.5}]}, {"start": 55.0, "end": 58.0, "text": " Remind her what love is.", "words": [{"word": " Remind", "start": 55.0, "end": 55.84}, {"word": " her", "start": 55.84, "end": 56.32}, {"word": " what", "start": 56.32, "end": 56.92}, {"word": " love", "start": 56.92, "end": 57.52}, {"word": " is.", "start": 57.52, "end": 58.0}]}];
  const cap = document.querySelector('.cap');
  window.ready = Promise.resolve();
  window.setTime = (t) => {
    cap.innerHTML = '';
    const s = segs.find(s => s.start <= t && t < s.end);
    if (!s) return false;
    const box = document.createElement('div');
    s.words.forEach((w, i) => {
      if (i > 0) box.append(' ');
      const span = document.createElement('span');
      span.textContent = w.word.trim();
      if (w.start <= t && t < w.end) span.className = 'lit';
      box.append(span);
    });
    cap.append(box);
    return true;
  };
</script>
