<!-- Dynamic captions, name cards and the corner badge for the browser
     route: the card and badge files as written, each on its own clock. -->
<!-- A name card, top left, four seconds: a bar grows, the name slides in
     behind a mask, the role follows, all of it leaves together. -->
<style>
  html, body { margin: 0 }
  .nc { position: absolute; left: 4%; top: 8%; display: flex; flex-direction: column; gap: 8px;
    font-family: "Liberation Sans"; animation: leave .4s 3.6s ease-in forwards }
  @keyframes leave { to { opacity: 0; transform: translateY(-12px) } }
  .bar { width: 0; height: 5px; background: #22d3ee; animation: bar .45s cubic-bezier(.22,.61,.36,1) forwards }
  @keyframes bar { to { width: 120px } }
  .mask { overflow: hidden }
  .name { font-size: 46px; font-weight: 700; color: #ffffff; text-shadow: 0 4px 20px #000000aa;
    animation: up .55s .15s cubic-bezier(.22,.61,.36,1) both }
  .role { font-size: 20px; font-weight: 700; letter-spacing: .2em; color: #22d3ee;
    animation: up .55s .3s cubic-bezier(.22,.61,.36,1) both }
  @keyframes up { from { transform: translateY(110%) } to { transform: translateY(0%) } }
</style><!-- A corner badge on screen the whole time: a pulsing dot, a label,
     a thin sheen crossing it every three seconds. -->
<style>
  html, body { margin: 0 }
  .badge { position: absolute; right: 3%; top: 6%; display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; border-radius: 6px; background: #0b0f14d9; box-shadow: 0 4px 18px #00000066;
    font-family: "Liberation Sans"; overflow: hidden }
  .dot { width: 14px; height: 14px; border-radius: 7px; background: #ef4444;
    animation: pulse 1s ease-in-out infinite alternate }
  @keyframes pulse { from { opacity: 1; transform: scale(1) } to { opacity: .35; transform: scale(.7) } }
  .live { font-size: 20px; font-weight: 700; letter-spacing: .14em; color: #ffffff }
  .org { font-size: 20px; font-weight: 400; letter-spacing: .08em; color: #94a3b8 }
  .sheen { position: absolute; top: 0; bottom: 0; left: -60px; width: 40px;
    background: linear-gradient(90deg, #ffffff00, #ffffff33, #ffffff00);
    animation: sheen 3s linear infinite }
  @keyframes sheen { from { transform: translateX(0px) } to { transform: translateX(420px) } }
</style>
<style>
  html, body { margin: 0; width: 1920px; height: 800px; background: transparent; }
  .g, .b { position: absolute; inset: 0; }
  .cap { position: absolute; left: 0; right: 0; bottom: 10%; display: flex; justify-content: center; }
  .cap div { max-width: 70%; font: 800 54px/1.2 "Liberation Sans"; color: white; text-align: center;
             -webkit-text-stroke: 10px #000000; paint-order: stroke fill; }
  .cap .lit { color: #22d3ee; }
</style>

nd": 63.0, "text": " But that's no reason to destroy the world.", "words": [{"word": " But", "start": 61.0, "end": 61.186}, {"word": " that's", "start": 61.186, "end": 61.512}, {"word": " no", "start": 61.512, "end": 61.651}, {"word": " reason", "start": 61.651, "end": 61.977}, {"word": " to", "start": 61.977, "end": 62.116}, {"word": " destroy", "start": 62.116, "end": 62.488}, {"word": " the", "start": 62.488, "end": 62.674}, {"word": " world.", "start": 62.674, "end": 63.0}]}, {"start": 65.0, "end": 66.0, "text": " Why does he do this?", "words": [{"word": " Why", "start": 65.0, "end": 65.19}, {"word": " does", "start": 65.19, "end": 65.429}, {"word": " he", "start": 65.429, "end": 65.571}, {"word": " do", "start": 65.571, "end": 65.714}, {"word": " this?", "start": 65.714, "end": 66.0}]}, {"start": 66.5, "end": 68.5, "text": " We already tried that one!", "words": [{"word": " We", "start": 66.5, "end": 66.722}, {"word": " already", "start": 66.722, "end": 67.315}, {"word": " tried", "start": 67.315, "end": 67.759}, {"word": " that", "start": 67.759, "end": 68.13}, {"word": " one!", "start": 68.13, "end": 68.5}]}, {"start": 71.5, "end": 72.5, "text": " Abort!", "words": [{"word": " Abort!", "start": 71.5, "end": 72.5}]}, {"start": 73.0, "end": 74.0, "text": " Cut!", "words": [{"word": " Cut!", "start": 73.0, "end": 74.0}]}, {"start": 74.0, "end": 75.0, "text": " Whoaaa!", "words": [{"word": " Whoaaa!", "start": 74.0, "end": 75.0}]}, {"start": 79.0, "end": 80.0, "text": " Whoaaa!", "words": [{"word": " Whoaaa!", "start": 79.0, "end": 80.0}]}, {"start": 81.0, "end": 83.0, "text": " Nooooo!", "words": [{"word": " Nooooo!", "start": 81.0, "end": 83.0}]}, {"start": 83.0, "end": 85.0, "text": " You broke my heart.", "words": [{"word": " You", "start": 83.0, "end": 83.4}, {"word": " broke", "start": 83.4, "end": 84.0}, {"word": " my", "start": 84.0, "end": 84.3}, {"word": " heart.", "start": 84.3, "end": 85.0}]}, {"start": 86.0, "end": 87.0, "text": " I know.", "words": [{"word": " I", "start": 86.0, "end": 86.25}, {"word": " know.", "start": 86.25, "end": 87.0}]}, {"start": 87.0, "end": 89.0, "text": " You forgot me on earth.", "words": [{"word": " You", "start": 87.0, "end": 87.333}, {"word": " forgot", "start": 87.333, "end": 87.917}, {"word": " me", "start": 87.917, "end": 88.167}, {"word": " on", "start": 88.167, "end": 88.417}, {"word": " earth.", "start": 88.417, "end": 89.0}]}, {"start": 89.0, "end": 90.0, "text": " I know.", "words": [{"word": " I", "start": 89.0, "end": 89.25}, {"word": " know.", "start": 89.25, "end": 90.0}]}];
  const cap = document.querySelector('.cap');
  const gs = [...document.querySelectorAll('.g')];
  const badge = document.querySelector('.b');
  window.ready = Promise.resolve();
  window.setTime = (t) => {
    for (const g of gs) {
      const local = t - Number(g.dataset.start);
      const on = local >= 0 && local < Number(g.dataset.dur);
      g.style.display = on ? '' : 'none';
      if (on) g.getAnimations({ subtree: true }).forEach(a => { a.pause(); a.currentTime = local * 1000; });
    }
    badge.getAnimations({ subtree: true }).forEach(a => { a.pause(); a.currentTime = t * 1000; });
    cap.innerHTML = '';
    const s = segs.find(s => s.start <= t && t < s.end);
    if (s) {
      const box = document.createElement('div');
      s.words.forEach((w, i) => {
        if (i > 0) box.append(' ');
        const span = document.createElement('span');
        span.textContent = w.word.trim();
        if (w.start <= t && t < w.end) span.className = 'lit';
        box.append(span);
      });
      cap.append(box);
    }
    return true;
  };
</script>
