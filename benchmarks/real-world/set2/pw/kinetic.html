<!-- Kinetic typography: four phrases, each on a panel that wipes in over
     the last, every word with its own motion. 1920x1080, 16 s. -->
<style>
  html, body { margin: 0 }
  .stage { position: absolute; inset: 0; overflow: hidden; background: #0b0b0f; font-family: "Liberation Sans" }
  .panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center }
  .p2 { background: #ff4d6d; clip-path: polygon(0% 0%, 0% 0%, -20% 100%, -20% 100%);
    animation: wipe-r .7s 4s cubic-bezier(.7,0,.2,1) forwards }
  .p3 { background: #f5f1e8; clip-path: polygon(120% 0%, 120% 0%, 100% 100%, 100% 100%);
    animation: wipe-l .7s 8s cubic-bezier(.7,0,.2,1) forwards }
  .p4 { background: #101114; clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%);
    animation: iris .8s 12s cubic-bezier(.7,0,.2,1) forwards }
  @keyframes wipe-r { to { clip-path: polygon(0% 0%, 120% 0%, 100% 100%, -20% 100%) } }
  @keyframes wipe-l { to { clip-path: polygon(-20% 0%, 120% 0%, 100% 100%, -20% 100%) } }
  @keyframes iris { to { clip-path: polygon(-60% 50%, 50% -60%, 160% 50%, 50% 160%) } }

  .row { display: flex; gap: 40px; align-items: baseline }
  .w { font-size: 190px; font-weight: 700; line-height: 1; letter-spacing: -.03em; color: #f8fafc; opacity: 0 }
  .hot { color: #ff4d6d }
  .from-left { animation: from-left .7s cubic-bezier(.34,1.56,.64,1) forwards }
  .from-right { animation: from-right .7s cubic-bezier(.34,1.56,.64,1) forwards }
  .pop { animation: pop .6s cubic-bezier(.34,1.56,.64,1) forwards }
  @keyframes from-left { from { opacity: 0; transform: translateX(-500px) } to { opacity: 1; transform: translateX(0px) } }
  @keyframes from-right { from { opacity: 0; transform: translateX(500px) } to { opacity: 1; transform: translateX(0px) } }
  @keyframes pop { from { opacity: 0; transform: scale(3) rotate(-12deg) } to { opacity: 1; transform: scale(1) rotate(0deg) } }

  .drop { color: #1a0a10; animation: drop .6s cubic-bezier(.34,1.56,.64,1) forwards }
  @keyframes drop { from { opacity: 0; transform: translateY(-400px) } to { opacity: 1; transform: translateY(0px) } }
  .fg { font-size: 150px; font-weight: 700; line-height: 1; color: #ffffff; opacity: 0; letter-spacing: .6em;
    animation: collapse 1.1s 4.8s cubic-bezier(.22,.61,.36,1) forwards }
  @keyframes collapse { from { opacity: 0; letter-spacing: .6em; transform: rotate(-6deg) }
                        to { opacity: 1; letter-spacing: -.02em; transform: rotate(0deg) } }

  .grow { color: #111827; font-size: 150px; animation: grow .7s cubic-bezier(.22,.61,.36,1) forwards }
  .accent { color: #7c3aed }
  @keyframes grow { from { opacity: 0; transform: scale(.3); filter: blur(20px) } to { opacity: 1; transform: scale(1); filter: blur(0px) } }

  .g { font-size: 260px; font-weight: 700; line-height: 1; letter-spacing: -.04em; opacity: 0;
    background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6); background-clip: text; color: transparent;
    animation: spin-in .8s cubic-bezier(.34,1.56,.64,1) forwards }
  @keyframes spin-in { from { opacity: 0; transform: rotate(-90deg) scale(.4) } to { opacity: 1; transform: rotate(0deg) scale(1) } }
  .tag { margin-top: 30px; font-size: 38px; font-weight: 700; letter-spacing: .3em; color: #94a3b8; opacity: 0;
    animation: fade .8s 13.3s ease-out forwards }
  @keyframes fade { from { opacity: 0; transform: translateY(20px) } to { opacity: 1; transform: translateY(0px) } }
</style>
<div class="stage">
  <div class="panel p1"><div class="row"><div class="w from-left" style="animation-delay: 0.20s">WRITE</div><div class="w from-right" style="animation-delay: 0.35s">THE</div><div class="w pop hot" style="animation-delay: 0.55s">EDIT</div></div></div>
  <div class="panel p2"><div class="row"><div class="w drop" style="animation-delay: 4.35s">NOT</div><div class="w drop" style="animation-delay: 4.50s">THE</div></div><div class="fg">FILTERGRAPH</div></div>
  <div class="panel p3"><div class="w grow" style="animation-delay: 8.35s">HTML</div><div class="w grow" style="animation-delay: 8.60s">+ CSS</div><div class="w grow accent" style="animation-delay: 8.85s">= MOTION</div></div>
  <div class="panel p4"><div class="row"><div class="g" style="animation-delay: 12.35s">g</div><div class="g" style="animation-delay: 12.43s">e</div><div class="g" style="animation-delay: 12.51s">n</div><div class="g" style="animation-delay: 12.59s">e</div><div class="g" style="animation-delay: 12.67s">v</div><div class="g" style="animation-delay: 12.75s">a</div></div><div class="tag">EDIT VIDEO LIKE CODE</div></div>
</div>

<script>
  window.ready = Promise.resolve();
  window.setTime = (t) => {
    // Outside its time the page draws nothing, so the blank frame the
    // capture takes first is really blank.
    document.body.style.visibility = (t < 0 || t >= 16) ? 'hidden' : '';
    if (t < 0 || t >= 16) return false;
    document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
    return true;
  };
</script>
